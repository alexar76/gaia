# Sensor.Community city mesh — operator-anchored area pins for ATLAS + GAIA.
#
# Canonical copy: gaia/config/sc_mesh_cities.yaml
# Mirror:         atlas/config/sc_mesh_cities.yaml  (must be identical — CI + sync script)
#
# Product model: buyers get *any* lat/lon via gaia.air.read@v1 on sc-01 / sc-{slug}.
# These pins are map anchors in SC-dense regions — not every SDS011 node on Earth.
# Berlin stays on legacy id sc-01 (env GAIA_SC_LAT/LON). Do not duplicate berlin here.
#
# Add a city: edit THIS file → run ./scripts/sync_physical_sensor_catalogs.sh → redeploy.
# Terms: docs/localization-glossary.md (mesh, pin, LIVE, sensor, relay, device_id).

version: 1

