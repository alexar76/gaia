# Extra sensors — operator-added devices for GAIA fleet + ATLAS pins.
#
# Canonical: gaia/config/extra_sensors.yaml
# Mirror:    atlas/config/extra_sensors.yaml
#
# Densify sparse LIVE layers with real upstream anchors (no invented sensors).
# Primary *-01 devices stay in code; these add geographic coverage.
#
# ONE COMMAND to append more:
#   python3 scripts/add_gaia_atlas_sensor.py --help
#
# Guide: docs/add-gaia-atlas-sensor.md

version: 1
sensors:
