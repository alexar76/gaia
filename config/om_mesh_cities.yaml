# Open-Meteo city mesh — single source for GAIA devices + ATLAS pins / Analyst.
#
# Canonical copy: gaia/config/om_mesh_cities.yaml
# Mirror:         atlas/config/om_mesh_cities.yaml  (must be identical — CI + sync script)
#
# Add a city: edit THIS file → run ./scripts/sync_om_mesh_catalog.sh → redeploy GAIA + ATLAS.
# Full recipe: docs/add-gaia-atlas-sensor.md
#
# Terms: docs/localization-glossary.md (mesh, pin, LIVE, SIM, sensor, relay, device_id).

version: 1

