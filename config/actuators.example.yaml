# A real Tasmota metering plug on your own MQTT broker.
#
#   GAIA_ACTUATION_ENABLED=1
#   GAIA_ACTUATORS_FILE=/path/to/this/file.yaml
#   GAIA_MQTT_BROKER=mqtt://192.168.1.10:1883      (mqtts:// for TLS)
#   GAIA_MQTT_USERNAME=gaia   GAIA_MQTT_PASSWORD=…  (from your secret store, never a file in git)
#   GAIA_ACTUATION_TOKEN=…                           (Bearer token for the kill switch API)
#
# The plug must report energy (an energy-monitoring model) and answer "Status 8".
# ON is sent as "PulseTime1 <duration>; Power1 ON", so the plug switches itself off
# after the paid duration even if GAIA or the broker goes away.
actuators:
  - id: lab-heater-01
    kind: tasmota-mqtt
    topic: tasmota_lab_heater   # the plug's %topic%
    label: "Lab oil heater (2 kW)"
    expect_on_w: 800            # below the heater's draw, above anything the plug idles at
    off_max_w: 5
    min_on_s: 30
    max_on_s: 1800
    cooldown_s: 60
    effect_timeout_s: 20
    latitude: 52.5200           # optional: where ATLAS shows it
    longitude: 13.4050
    # Who may command it: only its owner. Wallet addresses, QUOTED (YAML reads a bare 0x… as
    # a number). The owner signs commands with this wallet (EIP-712, gaia.owner.command@v1 —
    # no hub, no payment), or commands through a hub that vouches the owner paid. Delegates
    # are the owner's own agents' wallets. access: public is refused for a real plug.
    access: owner
    owner: "0x0000000000000000000000000000000000000001"   # always passes, may end any lease
    delegates:
      - "0x0000000000000000000000000000000000000002"      # e.g. the owner's home agent
    # Selling this plug's consumption statistics to others is the owner's choice, off by
    # default. With sale: true, gaia.consumption.read@v1 sells hourly (or only daily) totals
    # for at most history_days back; switching is never for sale.
    consumption:
      sale: false
      resolution: hour            # or day: sell only daily totals
      history_days: 30
