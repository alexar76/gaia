[project]
# Renamed from "gaia-gateway" on 2026-07-30, before first publish. Unprefixed short names on
# PyPI are claimable by strangers whose package can install a colliding top-level module — the
# incident behind this rule is recorded at the top of oracles/core/pyproject.toml. gaia lives
# outside oracles/, which is exactly why it was missed twice: once by the dependency-name sweep
# and once by the guard's glob. The guard now finds it by following the core dependency instead.
name = "aimarket-gaia-gateway"
# Bumped because the tree diverged from the published 0.1.2 wheel: `pip install
# aimarket-gaia-gateway==0.1.2` served code this tree had already moved past, at the same version
# string, so every fix in it was unpublishable and unreachable.
version = "0.2.0"
description = "GAIA — physical-world oracle gateway: virtual IoT devices sold as signed, verifiable AIMarket capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aimarket-oracle-core>=0.2",
    "httpx>=0.27.0",
    "h5py>=3.10",
    "tifffile>=2024.2",
    "pyproj>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    # The monorepo-only hub E2E imports sibling Hub sources through tests/conftest.py.
    # Keep the Hub package itself out of this extra so standalone GAIA still skips that
    # test, but install the two Hub runtime dependencies not otherwise present in GAIA.
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaia"]

[tool.hatch.build.targets.sdist]
include = [
  "/gaia",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/.gitignore",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
